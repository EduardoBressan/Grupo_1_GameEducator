spring.application.name=Grupo_1_GameEducator

# Profile padrao: postgres (usado pelo Docker Compose).
# Para rodar local em memoria: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# Desafio 3 (ADR-003): servico de IA em Python (FastAPI).
# Timeout curto: se a IA estiver fora ou lenta, o Core responde sem recomendacoes.
ia.base-url=${IA_BASE_URL:http://localhost:8000}
ia.timeout-ms=${IA_TIMEOUT_MS:2000}
