spring.application.name=Grupo_1_GameEducator

# Profile padrao: postgres (usado pelo Docker Compose).
# Para rodar local em memoria: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
